<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1040" viewBox="0 0 1400 1040" role="img" aria-labelledby="title desc">
<title id="title">推論フェーズ：目標画像を用いた観測と最終評価</title>
<desc id="desc">既知の基準軌道と目標画像から局所線幅を求めて観測に含め、固定方策で制御する。実測状態を次の観測に戻す。筆モデルの描画結果を目標画像と比較して最終評価する。</desc>
<defs><style>text{font-family:"Noto Sans CJK JP","Yu Gothic",sans-serif;fill:#243347}.heading{font-size:28px;font-weight:700}.label{font-size:21px;font-weight:700}.body{font-size:18px}.note{font-size:16px;fill:#526479}.flow{fill:none;stroke:#526479;stroke-width:2.5;marker-end:url(#arrow)}.feedback{fill:none;stroke:#0f766e;stroke-width:2.5;marker-end:url(#green)}</style><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#526479"/></marker><marker id="green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#0f766e"/></marker></defs><rect width="1400" height="1040" rx="16" fill="#f8fafc"/>
<text x="40" y="52" class="heading" text-anchor="start">推論フェーズ｜目標画像を用いた観測と最終評価</text>
<text x="40" y="86" class="note" text-anchor="start">評価対象：未学習文字「学」　／　推論中は方策の重みを更新しない</text>
<rect x="40" y="120" width="300" height="125" rx="12" fill="#edf4ff" stroke="#3973bd" stroke-width="2"/>
<text x="190.0" y="154" class="label" text-anchor="middle">既知のストローク</text>
<text x="190.0" y="186" class="body" text-anchor="middle">基準軌道CSV</text>
<text x="190.0" y="213" class="body" text-anchor="middle">筆順・基準位置・接線</text>
<rect x="40" y="300" width="300" height="125" rx="12" fill="#edf4ff" stroke="#3973bd" stroke-width="2"/>
<text x="190.0" y="334" class="label" text-anchor="middle">目標画像「学」</text>
<text x="190.0" y="366" class="body" text-anchor="middle">軌道付近の局所線幅を抽出</text>
<text x="190.0" y="393" class="body" text-anchor="middle">描画結果との比較にも使用</text>
<rect x="420" y="165" width="360" height="165" rx="12" fill="#edf9f5" stroke="#178073" stroke-width="2"/>
<text x="600.0" y="199" class="label" text-anchor="middle">事前処理</text>
<text x="600.0" y="231" class="body" text-anchor="middle">基準軌道周辺の目標画像を解析</text>
<text x="600.0" y="258" class="body" text-anchor="middle">目標線幅を画像幅−1で正規化</text>
<text x="600.0" y="285" class="body" text-anchor="middle">各ステップの特徴として用意</text>
<rect x="1000" y="120" width="350" height="125" rx="12" fill="#edf4ff" stroke="#3973bd" stroke-width="2"/>
<text x="1175.0" y="154" class="label" text-anchor="middle">学習済み方策の読込</text>
<text x="1175.0" y="186" class="body" text-anchor="middle">BC または BC+RL</text>
<text x="1175.0" y="213" class="body" text-anchor="middle">保存済み重みを固定</text>
<rect x="40" y="480" width="300" height="175" rx="12" fill="#edf4ff" stroke="#3973bd" stroke-width="2"/>
<text x="190.0" y="514" class="label" text-anchor="middle">観測 sₜ の構成</text>
<text x="190.0" y="546" class="body" text-anchor="middle">基準位置・実測位置・誤差</text>
<text x="190.0" y="573" class="body" text-anchor="middle">推定筆圧・接触状態・進捗</text>
<text x="190.0" y="600" class="body" text-anchor="middle">接線・正規化した目標線幅</text>
<rect x="510" y="480" width="330" height="175" rx="12" fill="#edf4ff" stroke="#3973bd" stroke-width="2"/>
<text x="675.0" y="514" class="label" text-anchor="middle">固定方策の推論</text>
<text x="675.0" y="546" class="body" text-anchor="middle">観測 sₜ → 行動 aₜ</text>
<text x="675.0" y="573" class="body" text-anchor="middle">XY補正量・筆圧目標を出力</text>
<text x="675.0" y="600" class="body" text-anchor="middle">基準軌道を逐次補正</text>
<rect x="1000" y="480" width="350" height="175" rx="12" fill="#edf9f5" stroke="#178073" stroke-width="2"/>
<text x="1175.0" y="514" class="label" text-anchor="middle">ROS 2 / Gazebo</text>
<text x="1175.0" y="546" class="body" text-anchor="middle">目標位置・Zに変換して駆動</text>
<text x="1175.0" y="573" class="body" text-anchor="middle">実測位置とZを取得</text>
<text x="1175.0" y="600" class="body" text-anchor="middle">実測Zから仮想筆圧を推定</text>
<path d="M340 180H420" class="flow"/>
<path d="M340 360H380V280H420" class="flow"/>
<path d="M500 330V430H190V480" class="flow"/>
<text x="515" y="365" class="note" text-anchor="start">基準位置・接線・正規化した目標線幅</text>
<path d="M1000 185H930V410H675V480" class="flow"/>
<text x="805" y="399" class="note" text-anchor="middle">固定済み重み</text>
<path d="M340 560H510" class="flow"/>
<text x="425" y="546" class="note" text-anchor="middle">観測</text>
<path d="M840 560H1000" class="flow"/>
<text x="920" y="546" class="note" text-anchor="middle">行動</text>
<path d="M1175 655V715H190V655" class="feedback"/>
<text x="680" y="704" class="note" text-anchor="middle">実測位置・Zから推定した仮想筆圧を次の観測へ</text>
<rect x="40" y="815" width="740" height="155" rx="12" fill="#fff5e9" stroke="#bf7629" stroke-width="2"/>
<text x="410.0" y="849" class="label" text-anchor="middle">最終評価・記録</text>
<text x="410.0" y="881" class="body" text-anchor="middle">描画画像と「学」の目標画像を比較</text>
<text x="410.0" y="908" class="body" text-anchor="middle">Dice / overflow / unpainted</text>
<text x="410.0" y="935" class="body" text-anchor="middle">実測軌跡・描画画像・評価値を保存</text>
<rect x="1000" y="815" width="350" height="155" rx="12" fill="#edf9f5" stroke="#178073" stroke-width="2"/>
<text x="1175.0" y="849" class="label" text-anchor="middle">筆モデル・描画</text>
<text x="1175.0" y="881" class="body" text-anchor="middle">実測位置・推定筆圧 → 線幅・筆跡</text>
<text x="1175.0" y="908" class="body" text-anchor="middle">学習時と共通の筆モデルを使用</text>
<text x="1175.0" y="935" class="body" text-anchor="middle">描画画像・塗り状態を生成</text>
<path d="M1290 655V815" class="flow"/>
<text x="1170" y="780" class="note" text-anchor="middle">実測位置・推定筆圧</text>
<path d="M1000 890H780" class="flow"/>
<text x="890" y="876" class="note" text-anchor="middle">描画画像</text>
<path d="M40 365H15V890H40" class="flow"/>
<text x="65" y="750" class="note" text-anchor="middle">目標画像</text>
<text x="40" y="1015" class="note" text-anchor="start">描画途中の画像比較結果や最終評価値は、次の観測には含めない。</text>
</svg>
